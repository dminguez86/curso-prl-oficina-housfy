<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso PRL · Personal de oficinas – Grupo Housfy</title>
<meta name="description" content="Formación PRL (art. 19 Ley 31/1995) para el personal de oficinas de Grupo Housfy, basada en la evaluación de riesgos.">
<style>
html{--bg:#eef5f9;--card:#fff;--txt:#1d2b36;--mut:#4a5a68;--pri:#0277ab;--pri2:#009CD7;--acc:#128a3c;--acc2:#16B14C;--bd:#d6e4ec;--ok:#15803d;--ko:#c62828;--amb:#a15c00;--navy:#06476b;--navy2:#0277ab;--btnTxt:#fff;--tagTxt:#035f8c}
html[data-theme=dark]{--bg:#06131c;--card:#0d2130;--txt:#e8f0f6;--mut:#a9bccb;--pri:#4cc0f0;--pri2:#38b6ec;--acc:#3ddc84;--acc2:#3ddc84;--bd:#24445a;--ok:#22c55e;--ko:#ff6b6b;--amb:#fbbf24;--navy:#041e2e;--navy2:#06476b;--btnTxt:#04121d;--tagTxt:#9fdcf7}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;transition:background .3s,color .3s;overflow-x:hidden;
background-image:radial-gradient(1100px 600px at 100% -10%,color-mix(in srgb,var(--pri2) 12%,transparent),transparent 60%),linear-gradient(color-mix(in srgb,var(--pri) 5%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--pri) 5%,transparent) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;background-attachment:fixed}
a{color:var(--pri)}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;border-bottom:3px solid var(--acc2);box-shadow:0 4px 18px #0003}
header h1{font-size:1rem;margin:0;flex:1;display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap;overflow:hidden}
header h1 span{overflow:hidden;text-overflow:ellipsis}
header button{background:#ffffff1a;border:1px solid #ffffff40;color:#fff}
.logo-h{height:34px;background:#fff;border-radius:8px;padding:3px 8px;display:block;flex:none}
.prog{flex:2;max-width:320px;height:8px;background:#ffffff30;border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#009CD7,#16B14C);transition:width .5s}
#pct{font-size:.85rem}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--txt);border-radius:9999px;padding:7px 14px;transition:transform .15s,background .2s}button:hover{transform:translateY(-1px)}
.btn{background:var(--pri);color:var(--btnTxt);border:none;font-weight:700;box-shadow:0 4px 12px color-mix(in srgb,var(--pri) 30%,transparent)}
.wrap{display:flex;max-width:1240px;margin:auto}
nav{width:290px;flex:none;padding:16px;position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto;background:color-mix(in srgb,var(--card) 70%,transparent)}
nav a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--txt);text-decoration:none;margin-bottom:2px;cursor:pointer;font-size:.88rem}
nav a:hover{background:color-mix(in srgb,var(--pri) 10%,transparent)}
nav a.on{background:linear-gradient(90deg,var(--pri),var(--pri2));color:var(--btnTxt)}nav a .ck{margin-left:auto}
nav details.ng{background:none;border:none;margin:6px 0}nav details.ng summary{padding:8px 10px;font-size:.92rem}nav details.ng summary small{color:var(--mut);font-weight:400}
main{flex:1;padding:22px;min-width:0}
.view{animation:fade .45s ease}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2,h3,h4{letter-spacing:-.01em;line-height:1.25}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 1px 2px #0000000d,0 8px 24px #0a1f330d}
.lc{cursor:pointer;transition:transform .2s,box-shadow .2s}.lc:hover{transform:translateY(-4px);box-shadow:0 10px 24px #00000022}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.03em;border-radius:99px;padding:2px 10px;background:color-mix(in srgb,var(--pri2) 14%,var(--card));color:var(--tagTxt);border:1px solid color-mix(in srgb,var(--pri2) 35%,transparent)}
.tag.t2{background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
details.bl{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 0;overflow:hidden}
details.bl summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none}details.bl summary::-webkit-details-marker{display:none}
details.bl summary::after{content:"＋";float:right;color:var(--pri)}details.bl[open] summary::after{content:"－"}
details.bl>div{padding:0 16px 14px}
.key{border-left:5px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.note{border-left:5px solid var(--pri2);background:color-mix(in srgb,var(--pri2) 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
.alert{border-left:5px solid var(--ko);background:color-mix(in srgb,var(--ko) 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
.caso{border:2px dashed color-mix(in srgb,var(--pri) 55%,transparent);background:color-mix(in srgb,var(--pri) 6%,var(--card));padding:12px 14px;border-radius:12px;margin:12px 0}
.caso>b:first-child{color:var(--pri)}
.tbl{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:480px;font-size:.92rem}th,td{border:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top}th{background:color-mix(in srgb,var(--pri) 15%,var(--card))}
.sem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.sem>div{border-radius:12px;padding:12px;border:2px solid}
.sv{border-color:#16B14C!important;background:color-mix(in srgb,#16B14C 10%,var(--card))}.sa{border-color:#f59e0b!important;background:color-mix(in srgb,#f59e0b 12%,var(--card))}.sr{border-color:#e53935!important;background:color-mix(in srgb,#e53935 10%,var(--card))}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.flow span{background:color-mix(in srgb,var(--pri) 12%,var(--card));border:1px solid color-mix(in srgb,var(--pri) 40%,transparent);border-radius:10px;padding:6px 10px;font-size:.88rem}.flow i{font-style:normal;color:var(--pri);font-weight:800}
.q{margin:16px 0}.q p{font-weight:700;margin:.2em 0 .5em}.opt{display:block;width:100%;text-align:left;margin:6px 0;border-radius:12px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.ko{background:var(--ko);color:#fff;border-color:var(--ko)}.opt:disabled{cursor:default;transform:none;opacity:1}
html[data-theme=dark] .opt.ok,html[data-theme=dark] .opt.ko{color:#04121d}
.fb{font-size:.9rem;min-height:1.2em;font-weight:600}.score{font-size:1.15rem;font-weight:800}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
figure{margin:12px 0;text-align:center}figure img{max-width:100%;border-radius:12px;border:1px solid var(--bd);cursor:zoom-in;background:#fff}figcaption{font-size:.8rem;color:var(--mut)}
.lb{position:fixed;inset:0;background:#000d;z-index:50;display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:fade .25s}.lb img{max-width:96vw;max-height:92vh;border-radius:8px;background:#fff}.lb button{position:fixed;top:12px;right:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mut);font-size:.88rem;margin:4px 0 8px}
.hx{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:40px 34px;background:linear-gradient(135deg,var(--navy) 0%,#035f8c 55%,#0291CE 100%);box-shadow:0 20px 50px #0a1f3355;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.hx::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#009CD7 0 50%,#16B14C 50% 100%)}
.hx>*{position:relative;min-width:0}
.logo-x{height:54px;background:#fff;border-radius:12px;padding:6px 12px;margin-bottom:14px;box-shadow:0 6px 18px #0003;max-width:100%}
.eyb{display:inline-flex;align-items:center;gap:8px;font-size:.76rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9ff0bb}
.eyb::before{content:"";width:26px;height:2px;background:#16B14C}
.hx h2{font-size:clamp(1.7rem,4.4vw,3.1rem);line-height:1.07;margin:.35em 0 .3em;font-weight:800}
.hx h2 em{font-style:normal;color:#9ff0bb}
.hx p.sub{font-size:1.04rem;color:#e1eef7;max-width:580px;margin:0 0 20px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.go{background:#0f7a35;color:#fff;border:none;font-weight:800;padding:13px 26px;font-size:1.02rem;box-shadow:0 8px 24px #16b14c55}
.go2{background:transparent;color:#fff;border:1px solid #ffffff66;padding:12px 18px}
.pbar{margin-top:18px;max-width:420px}.pbar small{color:#d3e4f0}.pbar div{height:8px;border-radius:9px;background:#ffffff26;overflow:hidden;margin-top:4px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#009CD7,#16B14C)}
.rack{width:100%;max-width:400px;justify-self:center}
.rack .box{animation:drop 5s ease-in-out infinite;transform-box:fill-box}
@keyframes drop{0%{transform:translateY(-30px);opacity:0}15%,85%{transform:none;opacity:1}100%{transform:none;opacity:1}}
.rack .fork{animation:fork 5s ease-in-out infinite}@keyframes fork{0%,100%{transform:translate(0,0)}40%{transform:translate(0,-62px)}60%{transform:translate(0,-62px)}}
.rack .lamp{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.2}}
.rack .scan{animation:scan 3.5s linear infinite}@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(150px)}100%{transform:translateY(0)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;border-top:3px solid var(--acc2)}
.stat b{display:block;font-size:1.6rem;line-height:1.1;color:var(--pri)}.stat span{font-size:.85rem;color:var(--mut)}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 10px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;position:relative;overflow:hidden}
.mc .n{font-size:2.6rem;font-weight:800;color:color-mix(in srgb,var(--pri2) 25%,transparent);position:absolute;right:14px;top:4px}
.mc h3{margin:.4em 0 .2em;font-size:1.02rem}.mc p{margin:0;color:var(--mut);font-size:.88rem}
.mp{height:6px;background:var(--bd);border-radius:9px;margin-top:12px;overflow:hidden}.mp i{display:block;height:100%;background:linear-gradient(90deg,#009CD7,#16B14C)}
.sech{display:flex;align-items:center;gap:10px;margin:26px 0 4px;font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.sech::after{content:"";flex:1;height:1px;background:var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.grid .card{margin:0}.grid h4{margin:.4em 0}
.hero{background:linear-gradient(135deg,var(--navy),#035f8c 60%,#0291CE);color:#fff;border-radius:18px;padding:26px}
.hero h2{margin:.2em 0}
.gym{width:100%;max-width:400px;justify-self:center}
.gym .bar{animation:lift 2.6s ease-in-out infinite}@keyframes lift{0%,100%{transform:translateY(160px)}45%,60%{transform:translateY(96px)}}
.gym .arm1{animation:a1 2.6s ease-in-out infinite;transform-origin:115px 150px}.gym .arm2{animation:a2 2.6s ease-in-out infinite;transform-origin:155px 150px}
@keyframes a1{0%,100%{transform:rotate(-60deg)}45%,60%{transform:rotate(0)}}@keyframes a2{0%,100%{transform:rotate(60deg)}45%,60%{transform:rotate(0)}}
.gym .kb{animation:sw 3s ease-in-out infinite;transform-origin:258px 240px}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.gym .pulse{stroke-dasharray:240;animation:pl 2s linear infinite}@keyframes pl{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}
.vb{display:inline-block;font-size:.78rem;font-weight:800;border-radius:99px;padding:1px 10px;border:1px solid;white-space:nowrap}
.v-trivial{background:#e6f4ea;color:#14532d;border-color:#15803d}.v-tolerable{background:#e0f2fe;color:#0c4a6e;border-color:#0369a1}.v-moderado{background:#fef3c7;color:#713f12;border-color:#a16207}.v-importante{background:#ffedd5;color:#7c2d12;border-color:#c2410c}.v-intolerable{background:#fee2e2;color:#7f1d1d;border-color:#b91c1c}
.rk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px solid var(--bd);border-left:5px solid var(--pri);border-radius:12px;padding:10px 12px;margin:10px 0;background:color-mix(in srgb,var(--pri) 5%,var(--card))}.rk small{color:var(--mut)}
.rc{font-weight:800;font-size:.8rem;background:var(--pri);color:var(--btnTxt);border-radius:8px;padding:1px 8px}
.ley{border-left:5px solid #7c3aed;background:color-mix(in srgb,#7c3aed 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
html[data-theme=dark] .ley{border-color:#c4b5fd}


button:disabled{opacity:.55;cursor:not-allowed}
.ub{max-width:200px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}.ub span{overflow:hidden;text-overflow:ellipsis}
body.noauth nav,body.noauth .prog,body.noauth #pct{display:none}
.auth{max-width:760px;margin:auto}.ah{grid-template-columns:1.3fr 1fr}.ah .gym{max-width:260px}
.tabs{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.af label{display:block;font-weight:700;margin:10px 0;font-size:.92rem}.af input:not([type=checkbox]),.af select{display:block;width:100%;font:inherit;font-weight:400;padding:10px 12px;margin-top:4px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--txt)}
.af input:focus,.af select:focus{outline:3px solid color-mix(in srgb,var(--pri) 45%,transparent)}
.af .chk{display:flex;gap:8px;align-items:flex-start;font-weight:600}.af .chk input{width:20px;height:20px;flex:none;margin-top:2px}
.rgpd{font-size:.82rem}.err{color:var(--ko);font-weight:700;min-height:1.2em}
.sw{text-align:left}
[hidden]{display:none!important}nav a.lk{opacity:.6}nav a.lk .ck{opacity:1}.lockv h2{margin-top:0}#menu{display:none}
ul,ol{padding-left:1.3em}li{margin:3px 0}
@media(max-width:1000px){.mods{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.hx{grid-template-columns:1fr;padding:28px 20px 32px}.rack,.gym{max-width:260px;order:-1}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){nav{position:fixed;left:0;top:59px;background:var(--card);z-index:9;transform:translateX(-105%);transition:transform .3s;border-right:1px solid var(--bd);width:min(290px,86vw)}nav.open{transform:none}#menu{display:inline-block}.prog{display:none}}
@media(max-width:600px){main{padding:14px 12px}.mods{grid-template-columns:1fr}.sem{grid-template-columns:1fr}.logo-h{height:28px}.logo-x{height:44px}header{gap:8px;padding:10px}header h1{font-size:.88rem}.card{padding:14px}details.bl>div{padding:0 12px 12px}}
@media(max-width:420px){#pct{display:none}.ub{max-width:110px;padding:6px 10px}.ah{padding:22px 16px}header h1 span{max-width:40vw}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,nav,.pn,.noprint,.alert{display:none!important}main{padding:0}body{background:#fff;color:#000}.wrap{display:block}details.bl{break-inside:avoid}}
</style>
</head>

const M1={t:"Introducción: tu formación, tus derechos y la evaluación de tu puesto",fmin:3,s:"Por qué recibes esta formación (art. 19), qué derechos y obligaciones tienes (arts. 18 y 29), cómo se ha evaluado el puesto de Personal de oficinas y cómo comunicar un riesgo.",L:[
{t:"Formación, derechos y obligaciones en prevención",ico:"⚖️",min:6,src:"Ley 31/1995 de Prevención de Riesgos Laborales, arts. 18, 19 y 29 · "+ER+" (riesgo 300, medidas 1 y 2)",
obj:["Conocer qué exige el art. 19 de la Ley 31/1995 sobre tu formación.","Identificar tus derechos de información, consulta y participación (art. 18).","Conocer tus obligaciones como trabajador o trabajadora (art. 29)."],
b:[["1. La formación que estás haciendo (art. 19)",LEY("Art. 19.1: «En cumplimiento del deber de protección, el empresario deberá garantizar que cada trabajador reciba una formación teórica y práctica, suficiente y adecuada, en materia preventiva, tanto en el momento de su contratación, cualquiera que sea la modalidad o duración de ésta, como cuando se produzcan cambios en las funciones que desempeñe o se introduzcan nuevas tecnologías o cambios en los equipos de trabajo.»")+LEY("Art. 19.1 (cont.): «La formación deberá estar centrada específicamente en el puesto de trabajo o función de cada trabajador, adaptarse a la evolución de los riesgos y a la aparición de otros nuevos y repetirse periódicamente, si fuera necesario.»")+LEY("Art. 19.2: «La formación a que se refiere el apartado anterior deberá impartirse, siempre que sea posible, dentro de la jornada de trabajo o, en su defecto, en otras horas pero con el descuento en aquélla del tiempo invertido en la misma. […] su coste no recaerá en ningún caso sobre los trabajadores.»")+NOTE("La propia evaluación lo recoge como medida (riesgo 300): <i>«Se facilitará a los trabajadores información y formación adecuada en materia de prevención de riesgos laborales, específica de su puesto de trabajo, incluyendo las normas internas de seguridad, los riesgos existentes y las medidas preventivas aplicables.»</i> Este curso está construido solo con los riesgos y medidas de tu evaluación.")],
["2. Tus derechos (art. 18)",LEY("Art. 18.1: el empresario adoptará las medidas adecuadas para que los trabajadores reciban todas las informaciones necesarias en relación con: a) los riesgos para la seguridad y la salud de los trabajadores en el trabajo, tanto aquellos que afecten a la empresa en su conjunto como a cada tipo de puesto de trabajo o función; b) las medidas y actividades de protección y prevención aplicables a los riesgos señalados en el apartado anterior; c) las medidas adoptadas de conformidad con lo dispuesto en el artículo 20 (emergencias).")+LEY("Art. 18.2: el empresario deberá consultar a los trabajadores, y permitir su participación, en el marco de todas las cuestiones que afecten a la seguridad y a la salud en el trabajo. Los trabajadores tendrán derecho a efectuar propuestas al empresario, así como a los órganos de participación y representación, dirigidas a la mejora de los niveles de protección de la seguridad y la salud en la empresa.")],
["3. Tus obligaciones (art. 29)",LEY("Art. 29.1: «Corresponde a cada trabajador velar, según sus posibilidades y mediante el cumplimiento de las medidas de prevención que en cada caso sean adoptadas, por su propia seguridad y salud en el trabajo y por la de aquellas otras personas a las que pueda afectar su actividad profesional, a causa de sus actos y omisiones en el trabajo, de conformidad con su formación y las instrucciones del empresario.»")+LEY("Art. 29.3: el incumplimiento por los trabajadores de las obligaciones en materia de prevención de riesgos tendrá la consideración de incumplimiento laboral a los efectos previstos en el artículo 58.1 del Estatuto de los Trabajadores.")],
["4. Comunicar riesgos: un canal para todos",`<p>Tu evaluación establece (riesgo 300, medida 2): <i>«Se establecerán canales de comunicación eficaces para que los trabajadores puedan informar de situaciones de riesgo, deficiencias o incidencias detectadas en el puesto de trabajo, adoptándose las medidas correctoras necesarias.»</i></p>${UL(["Comunica un suelo deteriorado, un cable suelto, un enchufe dañado o una molestia en la espalda o la vista: muchas medidas de la evaluación dicen expresamente que «se atenderán las comunicaciones de los trabajadores».","Usa el canal que tu empresa haya establecido; si no lo conoces, dirígete a tu responsable."])}`]],
key:"La formación es obligación del empresario: centrada en tu puesto, dentro de la jornada y sin coste para ti. Tienes derecho a información, consulta y participación, y la obligación de cumplir las medidas y comunicar los riesgos que detectes.",
q:[["Según el art. 19 de la Ley 31/1995, ¿cuándo debe recibirse formación preventiva?",["Al contratar y cuando cambian funciones, equipos o tecnologías","Solo al cumplir un año en la empresa","Solo si el trabajador la pide","Solo tras un accidente"],0],
["El coste de la formación preventiva:",["No recae nunca sobre el trabajador","Se descuenta de la nómina","Se reparte al 50 %","Lo paga el trabajador si es fuera de la jornada"],0],
["El art. 18 reconoce el derecho del trabajador a:",["Ser informado, consultado y participar en prevención","Elegir sus propios EPI sin control","No cumplir las medidas que no le gusten","Decidir el contenido de la evaluación"],0],
["Según el art. 29, el incumplimiento de las obligaciones preventivas por el trabajador:",["Se considera incumplimiento laboral","No tiene ninguna consecuencia","Es siempre un delito penal","Solo afecta a la empresa"],0],
["Si detectas una deficiencia en tu puesto, según tu evaluación debes:",["Comunicarla por los canales establecidos","Esperar a la próxima evaluación","Repararla tú mismo","Ignorarla si no te afecta"],0]]},
{t:"Tu puesto y cómo se ha evaluado",ico:"📊",min:6,src:ER+" (ficha del puesto, método y resumen de riesgos)",
obj:["Conocer la descripción, lugares y equipos del puesto evaluado.","Interpretar la matriz probabilidad × consecuencia.","Saber cuál es el riesgo Moderado del puesto y el EPI requerido."],
b:[["1. El puesto «Personal de oficinas»",T(["Dato","Valor"],[["Empresa","Despatx Olivares, S.L. (Grupo Housfy), centro Oficina"],["Evaluación","Ref. ER001-E00000280714-C001 · Revisión de evaluación · 11/02/2026"],["Puesto","Personal de oficinas · Tipo: Administración · Grupo N (no sensibles) · 4 trabajadores"],["C.N.O.","4500 – Empleados administrativos con tareas de atención al público"],["Incluye","Gestores/as, administradores/as, recepción, responsables de departamento y resto de personal de oficina"]])+`<p>Tareas administrativas, comerciales y de gestión de una oficina inmobiliaria: atención telefónica y presencial, correo, coordinación de visitas a inmuebles, contratos de arrendamiento y compraventa, expedientes, archivo físico y digital, facturación y actualización de bases de datos y portales web. Uso de <b>PVD más de 4 horas diarias</b>, mayoritariamente sentado, con desplazamientos ocasionales a inmuebles.</p>`],
["2. Dónde y con qué trabajas",T(["Lugares","Equipos de trabajo"],[["Oficina (dos plantas unidas por escalera fija, aseo, office, zona exterior en planta 0, dos salidas de emergencia)","Equipos informáticos · Ordenador portátil · Mesa, silla y mobiliario"],["Visitas a instalaciones ajenas a la empresa","Electrodomésticos de oficina · Herramientas de oficina"],["Espacio destinado al teletrabajo","Vehículo utilitario · Escalera de mano"]])+`<p><b>Producto químico:</b> fregaplatos manual. <b>EPI del puesto:</b> calzado antideslizante.</p>`],
["3. El método: probabilidad × consecuencia",`<p>Cada riesgo se valora combinando la <b>probabilidad</b> (1 baja: raras veces; 2 media: algunas ocasiones; 3 alta: siempre o casi siempre) y la <b>consecuencia</b> (1 daños leves; 2 daños graves; 3 muy graves).</p>${T(["C \\ P","Baja (1)","Media (2)","Alta (3)"],[["Leve (1)",V("Trivial"),V("Tolerable"),V("Moderado")],["Grave (2)",V("Tolerable"),V("Moderado"),V("Importante")],["Muy grave (3)",V("Moderado"),V("Importante"),V("Intolerable")]])}${T(["Nivel","Qué implica según la evaluación"],[["Trivial","No se necesita mejorar la acción preventiva, pero hacen falta comprobaciones periódicas."],["Tolerable","Esfuerzos para reducir el riesgo; medidas en un periodo determinado y comprobaciones periódicas."],["Moderado","Reducir el riesgo en un periodo determinado; con severidad alta, siempre que sea posible no comenzar el trabajo hasta reducirlo."],["Importante","No comenzar el trabajo hasta reducir el riesgo."],["Intolerable","No comenzar ni continuar; si no es posible reducirlo, prohibir el trabajo."]])}`],
["4. Resumen de riesgos de tu puesto",T(["Nº","Riesgo","P","C","Valoración"],[["010","Caída a distinto nivel","1","2",V("Tolerable")],["020","Caída al mismo nivel","1","2",V("Tolerable")],["040","Caída de objetos en manipulación","1","2",V("Tolerable")],["070","Choques contra elementos inmóviles","1","2",V("Tolerable")],["090","Golpes o cortes con objetos o herramientas","1","2",V("Tolerable")],["132","Confort térmico","1","2",V("Tolerable")],["150","Contactos eléctricos directos","1","2",V("Tolerable")],["151","Contactos eléctricos indirectos","1","2",V("Tolerable")],["180","Incendio","1","2",V("Tolerable")],["201","Accidente de tráfico","1","2",V("Tolerable")],["210","Agentes biológicos","1","2",V("Tolerable")],["250","Iluminación","1","2",V("Tolerable")],["251","Fatiga visual","1","2",V("Tolerable")],["260","Carga física: postura","2","2",V("Moderado")],["263","Manipulación manual de cargas","1","2",V("Tolerable")],["270–274","Psicosociales (fatiga, violencia, estrés, organización, desgaste)","1","2",V("Tolerable")],["275","Acoso laboral, sexual o por razón de sexo","1","2",V("Tolerable")],["300","Otros","1","2",V("Tolerable")]])+NOTE("El único riesgo <b>Moderado</b> del puesto es <b>260 Carga física: postura</b> (P2 · C2). Además, en lugares y equipos aparecen como Moderados el <b>150 contacto eléctrico directo de la instalación eléctrica</b> (P1 · C3) y el <b>201 accidente de tráfico con el vehículo utilitario</b> (P1 · C3), entre otros. Los verás en sus lecciones.")]],

const M2={t:"Ergonomía y trabajo con pantallas de visualización (PVD)",fmin:5,s:"El riesgo prioritario de tu puesto: la postura (260, Moderado). Qué es un «trabajador usuario» de PVD, cómo ajustar silla, mesa, pantalla, teclado y ratón, el portátil, y cómo prevenir los movimientos repetitivos con pausas.",L:[
{t:"Trabajador usuario de PVD y riesgo de postura",ico:"🖥️",min:8,src:ER+" (ficha del puesto y riesgo 260) · "+FPVD,
obj:["Saber qué es un puesto con PVD y quién es «trabajador usuario».","Conocer por qué la postura es el riesgo Moderado del puesto.","Identificar los daños que se quieren evitar."],
b:[["1. Qué es un puesto con PVD",`<p>Según el RD 488/1997, recogido en la ficha [F1], el puesto con pantalla incluye: la <b>pantalla</b>, el <b>teclado o programa</b>, los <b>accesorios opcionales</b> (módem, escáner, impresora), la <b>silla</b>, la <b>mesa</b> y el <b>entorno laboral</b>. Es decir, no solo el ordenador: todo lo que rodea a la persona.</p>`],
["2. «Trabajador usuario»: especialmente protegido",`<p>Es quien usa PVD de forma habitual y durante una parte relevante de su trabajo y, además, cumple alguna de estas condiciones [F1]:</p>${UL(["Depende del equipo para hacer su trabajo y no puede decidir si lo usa.","Necesita formación o experiencia específica para usarlo.","Lo usa en periodos continuos de 1 hora o más, a diario o casi.","Necesita recibir información rápida por pantalla, o la tarea exige un alto nivel de atención."])}${NOTE("Según la ficha, esto se cumple en la mayoría de trabajos administrativos. Tu evaluación describe uso continuado de PVD <b>más de 4 horas diarias</b>: eres trabajador/a usuario/a.")}`],
["3. Por qué la postura es Moderado",RK("260","Carga física: postura","Moderado",[2,2])+`<p>La evaluación explica que la permanencia prolongada sentado, junto con el uso continuado de teclado, ratón y dispositivos móviles, puede implicar riesgos ergonómicos por <b>posturas mantenidas</b>, <b>movimientos repetitivos</b> de los miembros superiores y <b>fatiga visual</b>. La probabilidad es media (el daño ocurrirá en algunas ocasiones) y la consecuencia, grave (trastornos musculoesqueléticos).</p>`],
["4. Qué daños se quieren evitar",UL(["Picor de ojos y lagrimeo.","Fatiga mental y dolor de cabeza.","Dolor de nuca, hombros, brazos, manos y espalda."])+`<p><small>Fuente: [F2].</small></p>`]],
key:"Si usas la pantalla de forma habitual y durante buena parte de la jornada eres «trabajador usuario» de PVD: la postura es tu riesgo Moderado y el puesto debe ajustarse a ti.",
q:[["Según el RD 488/1997, el puesto con PVD incluye:",["Pantalla, teclado, accesorios, silla, mesa y entorno","Solo la pantalla","Solo el ordenador y el ratón","Solo la silla"],0],
["¿Quién es «trabajador usuario» de PVD?",["Quien la usa de forma habitual y durante una parte relevante de su trabajo","Quien la usa 5 minutos al mes","Solo los informáticos","Solo quien trabaja desde casa"],0],
["¿Qué valoración tiene el riesgo 260 de postura en tu puesto?",["Moderado (P2 · C2)","Trivial","Intolerable","Tolerable (P1 · C1)"],0],
["Uno de los daños que se quieren evitar en el trabajo con PVD es:",["Dolor de nuca, hombros y espalda","Quemaduras químicas","Pérdida auditiva por impacto","Intoxicación por gases"],0]]},
{t:"Silla, mesa y reposapiés",ico:"🪑",min:12,src:ER+" (riesgo 260 del puesto y del equipo «Mesa, silla mobiliario oficina») · "+FPVD,
obj:["Ajustar la silla con apoyo lumbar y la postura correcta.","Conocer las dimensiones de una mesa adecuada.","Saber cuándo y cómo usar un reposapiés."],
b:[["1. La silla",`<p>La evaluación exige una silla <b>estable y regulable en altura</b>, con <b>respaldo ajustable</b> que dé apoyo lumbar y permita apoyar toda la espalda. Sus características mínimas: asiento estable, altura y profundidad regulables, respaldo con suave prominencia lumbar ajustable en altura e inclinación, <b>cinco apoyos</b> en el suelo y frente redondeado; los mandos deben poder manejarse <b>estando sentado</b>.</p>${T(["Elemento","Criterio de las fichas PVD"],[["Asiento","Suficientemente ancho, regulable en altura; profundidad regulable y algo inferior a la longitud del muslo; permite sentarse con la espalda a 90° respecto a las piernas [F1][F2]"],["Borde anterior","Redondeado e inclinado hacia abajo, para no oprimir la parte de atrás de las rodillas [F2]"],["Respaldo","Apoya toda la espalda y la zona lumbar; regulable en altura e inclinación y bloqueable [F1][F2]"],["Apoyabrazos","No obligatorios; si los hay, brazos a 90° con apoyo de codos y antebrazos [F2]"],["Base","5 apoyos con ruedas, con resistencia que evite desplazamientos involuntarios [F1][F2]"],["Tapizado","Transpirable y resistente al uso continuado [F2]"]])}<p>Para elegirla se considera el tiempo sentado (más de 4 h diarias no es lo mismo que unos minutos), si se alterna sentado y de pie y las preferencias de la persona [F2].</p>`],
["2. La postura correcta",UL(["Espalda apoyada en el respaldo, manteniendo las curvaturas naturales de la columna.","Ángulos de codos, espalda y rodillas rectos (90°); cabeza en línea con los hombros y hombros relajados.","Pies apoyados en el suelo o en el reposapiés.","Muñecas en posición neutra; evita giros o inclinaciones forzadas del tronco y del cuello."])],
["3. La mesa",T(["Elemento","Criterio"],[["Superficie","Mínimo aproximado 80 × 120 cm para tareas generales de oficina [F1][F2]; poco reflectante, acabado mate y tonos neutros"],["Altura","Según la talla: al teclear, antebrazos cerca de la horizontal; se recomienda que sea ajustable [F1][F2]"],["Hueco para piernas","≥ 70 cm de ancho; 60 cm de profundidad a nivel de rodillas y 80 cm a nivel de pies (evaluación y [F1]). No guardes objetos que lo impidan"],["Organización","Permitir colocar con flexibilidad pantalla, teclado, documentos y accesorios, y apoyar los antebrazos; mejor si permite canalizar internamente el cableado"]])],
["4. El reposapiés",`<p>La evaluación indica: cuando adaptes la silla a la altura de la mesa y <b>no llegues con los pies al suelo</b>, usa reposapiés regulado a la altura adecuada; se pondrá a disposición de quien lo desee.</p>${UL(["Medidas mínimas: <b>45 × 35 cm</b>, superficie antideslizante y regulable en altura [F1][F2].","Inclinación: la ficha [F1] indica 5–15° y la [F2], 0–15°."])}`],
["5. Mobiliario y golpes",`<p>Riesgo 070 del mobiliario: comprueba que los cajones están cerrados antes de levantarte, ciérralos después de cada uso, no los fuerces al llegar al tope y deja la silla bajo la mesa cuando abandones el puesto.</p>`+CASO("Los pies no llegan al suelo","Has subido la silla para que los codos queden a la altura de la mesa, pero tus pies quedan colgando.","No bajes la silla (forzarías hombros y muñecas): pide un reposapiés (mín. 45 × 35 cm, antideslizante y regulable) y regúlalo para apoyar bien los pies. Si la mesa es regulable, la alternativa es bajar la mesa.")]],
key:"Silla regulable con apoyo lumbar y mandos accesibles sentado, ángulos a 90°, pies apoyados (en el suelo o en un reposapiés de al menos 45 × 35 cm) y mesa de unos 80 × 120 cm con espacio libre para las piernas.",
q:[["¿Cuántos apoyos debe tener la base de la silla de trabajo?",["Cinco","Tres","Cuatro sin ruedas","Dos"],0],
["Los mandos de ajuste de la silla deben poder manejarse:",["Estando sentado","Solo con herramientas","Solo por el técnico de mantenimiento","De pie y con la silla volcada"],0],
["Si con la silla ajustada no llegas con los pies al suelo, debes:",["Usar un reposapiés regulado","Sentarte en el borde del asiento","Bajar la silla aunque fuerces los hombros","Cruzar las piernas"],0],
["Medidas mínimas del reposapiés según las fichas PVD:",["45 × 35 cm","10 × 10 cm","80 × 120 cm","20 × 15 cm"],0],
["Superficie mínima aproximada de la mesa para tareas generales de oficina:",["80 × 120 cm","40 × 60 cm","50 × 70 cm","200 × 200 cm"],0],
["Hueco recomendado bajo la mesa a nivel de rodillas:",["70 cm de ancho y 60 cm de profundidad","30 cm de ancho","No importa el espacio","10 cm de profundidad"],0]]},
{t:"Pantalla, teclado, ratón y portátil",ico:"⌨️",min:12,src:ER+" (riesgos 260 y 251 de «Equipos informáticos» y «Ordenador portátil») · "+FPVD,
obj:["Colocar la pantalla frente a ti, a 50–70 cm y con el borde superior a la altura de los ojos.","Conocer los requisitos de teclado, reposamuñecas, ratón y portadocumentos.","Adaptar el portátil para un uso prolongado."],
b:[["1. La pantalla",UL(["Situada <b>frente a ti</b>: pantalla y teclado en disposición totalmente frontal mientras los usas.","Distancia de <b>entre 50 y 70 cm</b> respecto a los ojos (riesgo 251 del puesto).","El <b>borde superior</b>, como máximo, a la altura de los ojos.","Zona visual óptima: entre la línea de visión horizontal y 30° por debajo; admisible hasta 60° bajo la horizontal.","Debe poder ajustarse en vertical y horizontal, inclinarse y orientarse [F2]; imagen estable, sin destellos, caracteres nítidos y brillo y contraste fáciles de ajustar; tamaño mínimo de 14\" en oficina [F1]."])],
["2. Teclado",T(["Requisito","Valor"],[["Independiente de la pantalla e inclinable","Para una postura cómoda que no canse brazos ni manos; con peso suficiente para no desplazarse [F2]"],["Espacio para apoyar las manos","10 cm del teclado al borde de la mesa, o un reposamuñecas"],["Altura de la 3.ª fila (central)","≤ 30 mm sobre la base de apoyo"],["Inclinación","Entre 0° y 25° respecto a la horizontal"],["Superficie","Mate, para evitar reflejos; caracteres legibles desde la posición de trabajo"],["Pulsación","Fuerza débil y uniforme, recorrido de 2–5 mm [F2]"]])],
["3. Reposamuñecas y ratón",`<p><b>Reposamuñecas</b> [F2]: reduce la carga estática y mantiene alineados antebrazo, muñeca y mano. Debe tener la misma altura que el teclado, <b>5–10 cm de profundidad</b>, la anchura del teclado, sin bordes cortantes, estable y antideslizante.</p><p><b>Ratón</b>: debe permitir apoyar dedos, mano o muñeca en la mesa con la <b>muñeca recta</b> (reposamuñecas si es necesario), ser apto para diestros y zurdos y adaptado a la curva de la mano. Colócalo lo más cerca posible del teclado y cógelo entre el pulgar y los dedos 4.º y 5.º, con el 2.º y 3.º sobre los botones [F2].</p>`],
["4. Portadocumentos o atril",`<p>La evaluación pide usar atril o portadocumentos en tareas de introducción, corrección o copia de datos frecuentes. Coloca los documentos a la misma altura y en el mismo plano que el monitor para reducir el esfuerzo visual; debe ser ajustable en altura, inclinación y distancia [F1].</p>`],
["5. El ordenador portátil",RK("260","Ordenador portátil: postura","Tolerable",[1,2])+`<p>Medida de la evaluación: <b>atril para el portátil y teclado y ratón independientes</b> si se usa habitualmente como PC de sobremesa. Así la pantalla sube a la altura de los ojos sin encorvar el cuello. Al transportarlo, cógelo con un agarre firme (riesgo 040) y mantén ordenada la zona de trabajo.</p>`+CASO("Toda la jornada en el portátil","Trabajas 6 horas al día con el portátil sobre la mesa y notas dolor de cuello.","Pide atril, teclado y ratón independientes; eleva la pantalla hasta que el borde superior quede como máximo a la altura de los ojos y a 50–70 cm. Comunica la molestia: la evaluación prevé revisar y adaptar el puesto.")]],
key:"Pantalla frontal a 50–70 cm con el borde superior a la altura de los ojos; teclado independiente con 10 cm de apoyo; muñeca recta con el ratón; y, si usas portátil a diario, atril más teclado y ratón externos.",
q:[["¿A qué distancia de los ojos debe situarse la pantalla según tu evaluación?",["Entre 50 y 70 cm","Entre 10 y 20 cm","A más de 1,5 m","Da igual"],0],
["El borde superior de la pantalla debe quedar:",["Como máximo a la altura de los ojos","30 cm por encima de los ojos","A la altura del pecho siempre","Por encima de la cabeza"],0],
["Espacio entre el teclado y el borde de la mesa según la evaluación:",["10 cm o usar reposamuñecas","0 cm","50 cm","No es necesario"],0],
["Inclinación recomendada del teclado:",["Entre 0° y 25°","Entre 45° y 60°","90°","Siempre plano a 0°, sin opciones"],0],
["Si usas el portátil habitualmente como PC de sobremesa, la evaluación prevé:",["Atril para el portátil y teclado y ratón independientes","Usarlo sobre las rodillas","Bajar el brillo al mínimo","Ninguna medida"],0],
["Para usar bien el ratón, la muñeca debe estar:",["Recta, con apoyo en la mesa","Doblada hacia arriba","Suspendida en el aire","Girada hacia fuera"],0]]},
{t:"Pausas, movimientos repetitivos y adaptación del puesto",ico:"⏱️",min:8,src:ER+" (riesgos 260 y 261 de «Equipos informáticos» y 260 del puesto)",
obj:["Aplicar la regla de pausas en el trabajo con PVD.","Prevenir lesiones por movimientos repetitivos.","Saber que el puesto se adapta a ti."],
b:[["1. Pausas y alternancia",`<p>Alterna las tareas con PVD con otras que permitan cambiar de postura. Cuando no sea posible, en trabajo permanente con pantalla que exige concentración, la evaluación establece pausas de:</p>${FLOW(["5–10 min cada hora","o","15 min cada 2 horas"])}${UL(["Fomenta la alternancia entre la posición sentada y pequeños desplazamientos.","Realiza ejercicios de relajación visual periódicamente."])}`],
["2. Movimientos repetitivos",RK("261","Carga física: movimientos repetitivos","Tolerable",[1,2])+UL(["Alterna tareas o rota para no repetir continuamente los mismos movimientos, y haz pausas cortas en los momentos de menor actividad.","Realiza ejercicios de relajación de los segmentos corporales que usas en la tarea.","Para proteger la zona metacarpiana: manos y muñecas en posición neutra alineadas con los antebrazos, sin apoyos prolongados sobre superficies duras, y <b>presión moderada</b> al teclear y usar el ratón."])],
["3. El puesto se adapta a ti",`<p>Medidas 6 y 9 del riesgo 260: se atenderán las comunicaciones sobre molestias musculoesqueléticas, revisando y adaptando el puesto, y se permitirá su <b>adaptación individual</b> según las características de cada persona.</p>`+CASO("Hormigueo en la mano","Tras varias semanas de mucho tecleo notas hormigueo en la mano derecha al final del día.","Revisa la postura (muñeca neutra, teclado y ratón cerca, reposamuñecas), haz pausas y alterna tareas, y comunícalo: la evaluación prevé revisar y adaptar el puesto.")]],
key:"Haz pausas de 5–10 minutos cada hora (o 15 cada 2 horas) si no puedes alternar tareas; teclea con presión moderada y muñecas neutras, y comunica cualquier molestia para adaptar tu puesto.",
q:[["Si no es posible alternar tareas en trabajo permanente con PVD, la evaluación establece pausas de:",["5–10 min cada hora o 15 min cada 2 horas","1 min cada 8 horas","Una pausa al mes","Ninguna pausa"],0],
["Para prevenir lesiones por movimientos repetitivos se recomienda:",["Alternar tareas y hacer ejercicios de relajación","Teclear con la máxima fuerza","No moverse en toda la jornada","Apoyar la muñeca en un borde duro"],0],
["Si notas molestias musculoesqueléticas, la evaluación prevé:",["Revisar y adaptar el puesto","No hacer nada","Que cambies de empresa","Reducir tu salario"],0],
["Al teclear y usar el ratón conviene aplicar:",["Una presión moderada","La máxima presión posible","Golpes secos","Solo un dedo"],0]]}
]};
const M3={t:"Fatiga visual, iluminación y confort térmico",fmin:4,s:"Cómo cuidar la vista ante la pantalla (251), qué iluminación necesita tu puesto (250: 500 lux) y qué temperatura y climatización son adecuadas en la oficina (132).",L:[
{t:"Fatiga visual y cuidado de la vista",ico:"👁️",min:9,src:ER+" (riesgo 251 del puesto y de «Equipos informáticos») · "+FPVD,
obj:["Reconocer la fatiga visual asociada a la pantalla.","Ajustar la pantalla para reducir reflejos y esfuerzo.","Adoptar hábitos de descanso y cuidado visual."],
b:[["1. El riesgo",RK("251","Fatiga visual","Tolerable",[1,2])+`<p>El uso continuado de PVD puede provocar fatiga visual. La evaluación pide ajustar la altura, distancia y orientación de la pantalla para evitar <b>reflejos, deslumbramientos y contrastes inadecuados</b>, con niveles de iluminación compatibles con la tarea y una combinación equilibrada de luz natural y artificial.</p>`],
["2. La pantalla, bien orientada",UL(["Pantalla <b>perpendicular a las ventanas</b>: la ventana no debe quedar ni detrás de la pantalla (deslumbramientos) ni detrás de ti (reflejos).","Lo más recomendable es que la luz incida <b>lateralmente</b> sobre el plano de trabajo; usa persianas, estores o cortinas.","Distancia aproximada de <b>50 a 70 cm</b> respecto a los ojos, con ángulo de visión adecuado."])],
["3. Ajustes que ayudan [F1][F2]",UL(["Preferir <b>polaridad positiva</b>: caracteres oscuros sobre fondo claro.","Pantalla con tratamiento antirreflejo; si no lo tiene y recolocarla no basta, <b>filtros antirreflejo o polarizados</b>.","Las pantallas LCD no emiten radiaciones, prácticamente no parpadean y consumen menos."])],
["4. Hábitos de cuidado visual",UL(["Haz pausas o cambios de tarea que permitan el descanso visual.","<b>Aparta la vista</b> de la pantalla con regularidad y enfoca a distintas distancias.","Mantén limpias gafas, lentillas, pantalla y filtro [F2].","Hazte <b>revisiones periódicas de la vista</b> con un especialista [F2].","Comunica las molestias visuales: la evaluación prevé adoptar medidas correctoras."])+CASO("Reflejos a media tarde","Por la tarde el sol de la ventana que tienes detrás se refleja en tu pantalla y fuerzas la vista.","Baja la persiana o el estor y, si persiste, pide reorientar el puesto para que la pantalla quede perpendicular a la ventana (luz lateral). Si no basta, un filtro antirreflejo.")]],
key:"Pantalla perpendicular a la ventana, a 50–70 cm, con polaridad positiva; aparta la vista con regularidad, limpia gafas y pantalla y revisa tu vista periódicamente.",
q:[["Respecto a las ventanas, la pantalla debe colocarse:",["Perpendicular a ellas, con la luz lateral","Con la ventana justo detrás de la pantalla","Con la ventana justo detrás del trabajador","Frente al sol directo"],0],
["La polaridad positiva consiste en:",["Caracteres oscuros sobre fondo claro","Caracteres claros sobre fondo negro","Pantalla apagada","Brillo al máximo"],0],
["Si la pantalla produce reflejos y no basta con recolocarla:",["Usar filtros antirreflejo o polarizados","Trabajar con los ojos entornados","Subir el brillo al máximo","No hacer nada"],0],
["Para descansar la vista se recomienda:",["Apartar la vista de la pantalla y enfocar a distintas distancias","Acercarse a 20 cm de la pantalla","Mirar fijamente sin parpadear","Trabajar a oscuras"],0],
["Las fichas PVD recomiendan respecto a la vista:",["Revisiones periódicas con un especialista","No usar nunca gafas","Revisarla solo si hay un accidente","Nada"],0]]},
{t:"Iluminación y confort térmico",ico:"💡",min:7,src:ER+" (riesgos 250 y 132 del puesto y de los lugares de trabajo)",
obj:["Conocer el nivel de iluminación de un puesto con PVD.","Saber qué temperaturas son adecuadas en la oficina.","Conocer el mantenimiento de la climatización."],
b:[["1. Iluminación (250)",RK("250","Iluminación","Tolerable",[1,2])+UL(["En puestos con uso continuado de PVD, lectura o escritura: mínimo <b>500 lux</b>.","Distribución <b>uniforme</b>, sin contrastes excesivos ni zonas de sombra; sin deslumbramientos, parpadeos ni efectos estroboscópicos.","Aprovechar la luz natural regulándola con persianas, cortinas o estores.","Mantenimiento periódico: sustituir lámparas deterioradas y limpiar luminarias y difusores; revisiones periódicas de los niveles.","Comprobar periódicamente el <b>alumbrado de emergencia</b>, dejando registro de la revisión.","Comunica las deficiencias de iluminación que detectes."])],
["2. Temperatura y ambiente (132)",RK("132","Confort térmico","Tolerable",[1,2])+T(["Tipo de trabajo","Temperatura recomendada"],[["Sedentario (oficina)","17 – 27 °C"],["Ligero","14 – 25 °C"]])+UL(["Evitar corrientes de aire, cambios bruscos de temperatura y temperaturas extremas.","Regular con calefacción y aire acondicionado según la actividad; ventilación efectiva que aporte aire fresco sin corrientes y humedad relativa adecuada."])],
["3. Mantenimiento de la climatización",T(["Elemento","Frecuencia"],[["Limpieza de filtros","Mínimo 2 veces al año (primavera y otoño)"],["Rejillas, bandejas de condensación…","Según programa de revisiones del fabricante"],["Limpieza de conductos","Recomendada cada 6 o 7 años"]])+CASO("Corriente fría en la nuca","La salida del aire acondicionado te da directamente en la nuca toda la jornada.","Comunícalo: la evaluación pide evitar corrientes de aire y regular la climatización según la actividad; puede reorientarse la rejilla o reubicarse el puesto.")]],
key:"Puesto con PVD: al menos 500 lux, luz uniforme y sin deslumbramientos. Oficina: 17–27 °C sin corrientes, y filtros del aire acondicionado limpios al menos dos veces al año.",
q:[["Nivel mínimo de iluminación en puestos con uso continuado de PVD según la evaluación:",["500 lux","50 lux","100 lux","5.000 lux"],0],
["Rango de temperatura recomendado para trabajos sedentarios:",["17 – 27 °C","5 – 10 °C","28 – 35 °C","0 – 14 °C"],0],
["Los filtros del aire acondicionado deben limpiarse:",["Como mínimo dos veces al año","Cada 10 años","Nunca","Solo si se rompen"],0],
["En la iluminación del puesto debe evitarse:",["Parpadeos, deslumbramientos y efectos estroboscópicos","La luz natural en todo caso","Una distribución uniforme","El mantenimiento de luminarias"],0],
["El alumbrado de emergencia debe:",["Comprobarse periódicamente, dejando registro","Desconectarse para ahorrar","Revisarse solo tras un incendio","Taparse con mobiliario"],0]]}

const M4={t:"Lugares de trabajo seguros",fmin:4,s:"Caídas, tropiezos, golpes y choques en la oficina: orden y limpieza, cables, suelos, cristales, mobiliario, almacenaje y el uso de escaleras de mano (010, 020, 040, 050, 060, 070, 080, 110).",L:[
{t:"Orden, suelos, cables y choques",ico:"🧹",min:10,src:ER+" (riesgos 020, 060, 070 y 080 del puesto y de la oficina)",
obj:["Prevenir resbalones y tropiezos con orden y limpieza.","Conocer la deficiencia de cableado detectada en la oficina y su corrección.","Evitar golpes con mobiliario, cristales y puertas."],
b:[["1. Caídas al mismo nivel (020)",RK("020","Caída de personas al mismo nivel","Tolerable",[1,2])+UL(["Orden y limpieza en zonas de trabajo y de paso: sin objetos, cables, materiales ni otros obstáculos; retira los restos al terminar.","Señaliza los suelos mojados o deslizantes y restringe el paso si hace falta.","Antes de desplazarte, comprueba el recorrido: objetos en el suelo, cables mal canalizados, archivadores abiertos o puertas en mala posición.","Suelos regulares, estables y antideslizantes; comunica baldosas sueltas o superficies deterioradas.","Calzado estable con suela antideslizante (es el EPI de tu puesto); no corras ni transportes objetos que te tapen la vista."])],
["2. Lo que se encontró en la visita: cables sueltos",ALERT("En la oficina se observó cableado de ordenadores y equipos informáticos por el suelo y zonas de paso <b>sin canalizar ni sujetar</b>: riesgo de tropiezos y caídas y de daños en los cables (pellizcos, desconexiones, aislamiento deteriorado), que puede derivar en riesgo eléctrico.")+`<p><b>Medida correctora</b> (RD 486/1997 y RD 1215/1997): canalizar y sujetar el cableado con canaletas fijadas a pared o mesa, pasacables protegidos en el suelo cuando sea imprescindible cruzar zonas de tránsito, o sistemas de agrupación bajo las mesas. <b>En ningún caso deben quedar cables sueltos en áreas de circulación.</b></p>`],
["3. Pisadas y desplazamientos (060)",UL(["Camina con precaución; no corras, no saltes ni circules con prisas.","Usa las zonas de paso habilitadas, sin atajos, y no invadas zonas señalizadas con acceso prohibido."])],
["4. Choques y golpes (070 y 080)",UL(["Pasillos despejados: el almacenamiento no invade las zonas de tránsito; se protegen o señalizan salientes y aristas.","Mobiliario distribuido con espacio suficiente para moverse; buena iluminación en las zonas de circulación.","Cajones y puertas de armarios <b>cerrados</b> cuando no se usan; deja la silla bajo la mesa.","Tabiques acristalados de <b>material seguro</b> (o separados de puestos y vías) y <b>señalizados</b> para no confundirlos con zonas de paso.","Puertas oscilantes con superficie <b>transparente</b> de material no frágil, para ver a quien viene del otro lado.","No te sitúes en el radio de acción de partes móviles de los equipos."])+T(["Espacio mínimo por trabajador","Valor"],[["Altura suelo–techo","3 m (2,5 m en oficinas y despachos)"],["Superficie libre","2 m²"],["Volumen no ocupado","10 m³"]])],
["5. Caso",CASO("La regleta en el pasillo","Un compañero ha conectado un ventilador con el cable cruzando el pasillo hasta su mesa.","Es exactamente la deficiencia detectada: cable suelto en zona de paso. Desconéctalo o reubícalo y comunícalo para canalizarlo con canaletas o un pasacables protegido.")]],
key:"Ningún cable suelto en zonas de paso, suelos limpios y señalizados si están mojados, cajones cerrados y cristales señalizados: la mayoría de accidentes de oficina se evitan con orden.",
q:[["¿Qué deficiencia se observó en la visita a la oficina?",["Cables de ordenadores sueltos por el suelo y zonas de paso","Falta de mesas","Ausencia de ventanas","Suelo de tierra"],0],
["La medida correctora para el cableado es:",["Canalizarlo con canaletas o pasacables protegidos","Taparlo con una alfombra","Pegarlo con cinta aislante al suelo mojado","Dejarlo como está"],0],
["Si el suelo está mojado se debe:",["Señalizarlo y restringir el paso si es necesario","Correr para cruzarlo rápido","Ignorarlo","Taparlo con papeles"],0],
["Las puertas oscilantes deben tener:",["Una superficie transparente de material no frágil","Cerradura con llave","Un espejo","Cortinas"],0],
["Superficie libre mínima por trabajador:",["2 m²","0,5 m²","20 m²","No hay mínimo"],0],
["Los tabiques de cristal cercanos a vías de circulación deben:",["Ser de material seguro y estar señalizados","Estar siempre abiertos","Pintarse de negro","No requieren nada"],0]]},
{t:"Trabajos en altura, escaleras de mano y almacenaje",ico:"🪜",min:11,src:ER+" (riesgos 010, 040, 050 y 110 del puesto y lugares; equipo «Escalera de mano»: 010 y 300)",
obj:["Saber qué hacer para alcanzar objetos en altura.","Usar correctamente una escalera de mano.","Almacenar de forma estable y segura."],
b:[["1. Caídas a distinto nivel (010)",RK("010","Caída de personas a distinto nivel","Tolerable",[1,2])+UL(["Para colocar o retirar archivadores o material en altura usa elementos auxiliares adecuados, estables y en buen estado, como escaleras de mano homologadas.","<b>Prohibido improvisar</b> accesos con sillas, cajas, mesas, etc.","<b>Prohibidos los trabajos en altura por encima de 2 m</b> sin protección.","Las trabajadoras embarazadas no deben realizar trabajos en altura.","Escalones y desniveles señalizados y contrastados, con pasamanos cuando sea necesario. La oficina tiene dos plantas unidas por una escalera fija: presta atención al usarla."])],
["2. Uso seguro de la escalera de mano",T(["Norma","Detalle"],[["3 puntos de apoyo","Dos pies y una mano, o dos manos y un pie; subir, bajar y trabajar de frente"],["Ángulo","75° con la horizontal; si se usa para acceder a un lugar elevado, largueros prolongados al menos 1 m"],["Tijera","Totalmente abierta y estable; no pasar de un lado a otro por arriba ni trabajar «a caballo»"],["Altura de trabajo","Nunca por encima del tercer peldaño contando desde arriba"],["Ubicación","Lejos de zonas de paso y de puertas; nadie debajo mientras se usa"],["Estado","Revisarla; no usar escaleras reparadas con clavos o alambres, pintadas (madera) ni improvisadas; avisar de deficiencias"],["Cargas","No transportar cargas por la escalera que comprometan la seguridad"],["Norma técnica","Conforme a UNE EN 131"],["Electricidad","Cerca de instalaciones eléctricas, solo escaleras aislantes"]])+NOTE("Evitar el uso de escaleras de mano por trabajadoras embarazadas.")],
["3. Las escaleras de la oficina",`<p>En la visita se encontraron varias escaleras manuales que, según la empresa, <b>el personal propio no usa</b>. Medida correctora (RD 1215/1997 y RD 486/1997): retirar las que no sean necesarias o guardarlas en un lugar habilitado, identificadas y <b>bajo control</b>. Si las usan empresas externas, se formaliza por escrito una <b>cesión del equipo</b> (identificación, estado de revisión, fechas, compromiso de uso y obligación de comunicar defectos), verificando antes su estado.</p>${NOTE("Consecuencia práctica: si no está previsto que uses una escalera de mano, no la cojas por tu cuenta. Pide ayuda o solicita el medio adecuado.")}`],
["4. Almacenaje y caída de objetos (040, 050, 110)",UL(["Almacena de forma ordenada y estable, sin acumular en estanterías, armarios o superficies elevadas; lo de uso frecuente, a alturas accesibles.","No coloques objetos de forma inestable donde puedan caer sobre alguien.","Transporta cajas y archivadores de uno en uno; si pesan o abultan, pide ayuda o usa medios auxiliares.","Agarres firmes, con las manos limpias y secas; atención a bordes y aristas.","Armarios, estanterías y archivadores <b>anclados o arriostrados</b> para evitar el vuelco; se revisa periódicamente su estado.","No almacenes cajas ni equipos en zonas de paso."])+CASO("La caja del estante de arriba","Necesitas una caja de archivo del estante superior y la silla con ruedas está a mano.","Nunca te subas a la silla (prohibido improvisar). Pide ayuda o el medio auxiliar adecuado, y propón recolocar lo que se usa a menudo a una altura accesible.")]],
key:"Nunca subas a sillas, cajas o mesas; por encima de 2 m no se trabaja sin protección. Con escalera: 3 apoyos, 75° y nunca por encima del tercer peldaño desde arriba. Almacena estable y con los muebles anclados.",
q:[["Para alcanzar un archivador en altura, ¿qué está prohibido?",["Subirse a una silla, caja o mesa","Pedir ayuda","Usar un medio auxiliar adecuado","Recolocar el material"],0],
["Los trabajos en altura sin protección están prohibidos por encima de:",["2 metros","10 metros","50 cm","No hay límite"],0],
["En una escalera de mano se deben mantener:",["3 puntos de apoyo","1 punto de apoyo","Las dos manos ocupadas con carga","Los pies en el último peldaño"],0],
["Ángulo correcto de una escalera de mano simple con la horizontal:",["75°","30°","90°","45°"],0],
["¿Qué medida correctora prevé la evaluación para las escaleras manuales de la oficina?",["Retirarlas o guardarlas bajo control, y formalizar su cesión si las usan externos","Pintarlas","Prestarlas a cualquiera","Ninguna"],0],
["Para evitar el vuelco de armarios y estanterías hay que:",["Anclarlos o arriostrarlos","Llenarlos al máximo por arriba","Apoyarlos en ruedas","Colocarlos en el pasillo"],0]]}
]};
const M5={t:"Manipulación de cargas, herramientas y equipos de oficina",fmin:4,s:"Cómo mover cajas y archivadores sin lesionarte (263), con especial protección del embarazo, y cómo usar con seguridad cúteres, tijeras y otros equipos de oficina (090, 100, 110, 140, 220).",L:[
{t:"Manipulación manual de cargas",ico:"📦",min:10,src:ER+" (riesgo 263 del puesto y de «Ordenador portátil»)",
obj:["Conocer los pesos orientativos máximos.","Aplicar la técnica segura de levantamiento.","Conocer las limitaciones durante el embarazo y el post-parto."],
b:[["1. Primero, evitarla",RK("263","Carga física: manipulación manual de cargas","Tolerable",[1,2])+`<p>Con carácter general se evita la manipulación manual siempre que sea posible, priorizando medios mecánicos o ayudas técnicas (<b>carros, transpaletas manuales, archivadores móviles</b>) o pidiendo ayuda a un compañero cuando el peso, el tamaño o el volumen lo aconsejen.</p>`],
["2. Pesos orientativos",T(["Situación","Peso máximo orientativo (condiciones ideales)"],[["General","25 kg"],["Mujeres y menores de edad","15 kg"],["Excepcional y esporádico, sin alternativa técnica","Hasta 40 kg, solo trabajadores sanos y entrenados"]])],
["3. Técnica segura",FLOW(["Pies separados y bien apoyados","Acércate a la carga","Flexiona rodillas, espalda recta","Agarra con las dos manos","Levanta sin tirones, carga pegada al cuerpo"])+UL(["Agarra por asas o zonas de agarre, con las manos secas y limpias.","Sin giros ni torsiones del tronco; no levantes por encima de la cintura en un solo movimiento.","Evita manipular por debajo de media pierna o por encima de los hombros.","No lleves varias cargas a la vez: mejor dos viajes que uno muy cargado.","Empujar o tirar: punto de fuerza entre la altura de los nudillos y los hombros, con apoyo firme de los pies.","Faja lumbar: solo de forma puntual, nunca continuada, y no sustituye a otras medidas."])],
["4. Embarazo y post-parto",T(["Fase","Limitación según la evaluación"],[["Seis primeros meses","No más de 5 kg si se superan 4 manipulaciones por turno; no más de 10 kg si son menos de 4"],["Desde el 7.º mes","Evitar completamente la manipulación de cargas y el arrastre o empuje"],["Post-parto","Aumentar el peso de forma gradual durante los 6 meses posteriores"],["Empuje o arrastre","Nunca más de 8 kg"]])+UL(["Al comunicar un embarazo o lactancia se hace una evaluación específica del puesto y se adaptan las tareas; si no es posible, se valora el cambio temporal de puesto.","Prevalecen siempre las indicaciones del personal médico."])+CASO("Mudanza de archivo","Hay que bajar diez cajas de documentación al almacén y una compañera embarazada de 7 meses se ofrece a ayudar.","Desde el séptimo mes debe evitar completamente manipular cargas y empujar o arrastrar. Usad un carro, repartid las cajas entre otras personas y haced varios viajes sin cargar varias cajas a la vez.")]],
key:"Evita cargar si puedes usar un carro o pedir ayuda; como orientación, máximo 25 kg (15 kg mujeres y menores); rodillas flexionadas, espalda recta y carga pegada al cuerpo. En el embarazo, límites mucho más bajos.",
q:[["Peso máximo orientativo de carga en condiciones ideales con carácter general:",["25 kg","50 kg","5 kg","100 kg"],0],
["Peso máximo recomendado para mujeres y menores de edad:",["15 kg","30 kg","40 kg","2 kg"],0],
["Para levantar una caja del suelo debes:",["Flexionar las rodillas y mantener la espalda recta","Doblar la espalda con las piernas rectas","Girar el tronco mientras levantas","Levantarla de un tirón"],0],
["Desde el séptimo mes de embarazo:",["Se evita completamente manipular cargas y empujar o arrastrar","Se pueden levantar 25 kg","No hay limitaciones","Solo se limita el uso del ordenador"],0],
["La faja lumbar, según la evaluación:",["Solo de forma puntual, sin sustituir otras medidas","Debe usarse toda la jornada","Sustituye a la técnica correcta","Es obligatoria en oficinas"],0],
["Si tienes que mover varias cajas:",["Mejor varios viajes que uno muy cargado","Apilarlas todas y llevarlas de una vez","Arrastrarlas con el pie","Lanzarlas"],0]]},
{t:"Herramientas y equipos de oficina",ico:"✂️",min:6,src:ER+" (riesgos 090 del puesto y de «Herramientas de oficina»; 100, 110, 140, 220 y 300 de los equipos de trabajo)",
obj:["Usar con seguridad cúteres, tijeras y material cortante.","Conocer las normas básicas de uso de los equipos de oficina.","Saber cuándo se requiere protección ocular o auditiva."],
b:[["1. Golpes y cortes (090)",RK("090","Golpes o cortes (herramientas de oficina)","Tolerable",[2,1])+UL(["<b>Cúter con dispositivo de seguridad</b> (hoja no accesible sin uso) y <b>tijeras de punta redondeada</b>.","Nunca guardes cúteres ni herramientas en los <b>bolsillos</b>.","Retira o sustituye el material cortante, punzante o deteriorado (cúteres, tijeras, grapadoras, abrecartas).","Usa cada herramienta solo para lo que está diseñada; guárdalas ordenadas, lejos de zonas de paso, bordes de mesa o cajones abiertos; prioriza las que tienen funda o capuchón.","Si hace falta, guantes de protección adecuados."])],

const M6={t:"Riesgo eléctrico en la oficina",fmin:5,s:"La electricidad está en cada enchufe del puesto. Riesgo eléctrico de la instalación (150, Moderado por la deficiencia del cuadro) y de los equipos y electrodomésticos de oficina (151): qué hace la empresa y qué haces tú.",L:[
{t:"La instalación eléctrica y el cuadro",ico:"⚡",min:10,src:ER+" (riesgos 150 y 180 de la fuente «Instalación eléctrica»; 150 del puesto; 150 y 151 de los equipos de trabajo)",
obj:["Distinguir contacto eléctrico directo e indirecto.","Conocer la deficiencia del cuadro eléctrico y su corrección.","Saber qué mantenimiento corresponde a la empresa y qué no debes tocar."],
b:[["1. Directo e indirecto",T(["Riesgo","Qué es","Nivel en tu evaluación"],[["150 Contacto directo","Tocar una parte que está en tensión normalmente (cable pelado, interior de un enchufe…)","Tolerable en el puesto; <b>Moderado (P1 · C3)</b> en la instalación y en los equipos de trabajo"],["151 Contacto indirecto","Tocar una parte que se ha puesto en tensión por un fallo (carcasa de un aparato averiado)","Tolerable; <b>Moderado (P1 · C3)</b> en los equipos de trabajo"]])+NOTE("La consecuencia (C3) es la máxima de la escala: una descarga eléctrica puede ser mortal. Por eso, aunque la probabilidad sea baja, el nivel sube a Moderado.")],
["2. Lo que se encontró: un cuadro sin señalizar",RK("150","Contactos eléctricos directos – Instalación eléctrica","Moderado",[1,3])+ALERT("En la visita se comprobó que un cuadro eléctrico de las instalaciones <b>no tenía señalización de advertencia</b> del riesgo eléctrico en lugar visible. Sin ella, personal no habitual, empresas externas o quien actúe en una emergencia pueden no identificar el peligro.")+`<p><b>Medida correctora</b> (RD 614/2001 y RD 485/1997): instalar en la puerta del cuadro o su entorno inmediato la señal normalizada: <b>triángulo de fondo amarillo con el rayo negro</b>. Además, los cuadros deben estar <b>tapados con puerta</b>.</p>`],
["3. Mantenimiento que corresponde a la empresa",T(["Actuación","Frecuencia"],[["Prueba de los interruptores diferenciales (botón de test)","1 vez al mes"],["Revisión de la toma de tierra por organismo o instalador autorizado, con registro","Anual (RD 842/2002; ITC-BT 18)"],["Inspección por OCA (solo en los casos que fija el REBT: p. ej., >100 kW o pública concurrencia)","Inicial y cada 5 años en esos casos"]])],
["4. El cuadro: lo que tú no haces",UL(["No dejes materiales en los cuartos de cuadros ni dentro de ellos.","<b>No manipules el cuadro ni fuerces el rearme</b> de magnetotérmicos o diferenciales; mantenlo cerrado.","Respeta las señales de riesgo eléctrico en equipos, cuadros y puertas.","No manipules instalaciones ni equipos eléctricos sin formación y autorización."])+CASO("Salta el diferencial","Al enchufar un calefactor salta el diferencial y la planta se queda sin luz. Un compañero va a subirlo una y otra vez.","No se fuerza el rearme: si salta es porque detecta un fallo. Desconecta el aparato que lo ha provocado, no toques la instalación e informa a la empresa para que lo revise personal cualificado.")]],
key:"El cuadro eléctrico debe estar cerrado y señalizado con el triángulo amarillo del rayo; los diferenciales se prueban una vez al mes y la toma de tierra se revisa cada año. Tú no lo manipulas ni fuerzas un rearme.",
q:[["¿Qué deficiencia eléctrica se detectó en la oficina?",["Un cuadro eléctrico sin señalización de advertencia","Ausencia total de enchufes","Cables de alta tensión en las mesas","Ninguna"],0],
["La señal de riesgo eléctrico normalizada es:",["Triángulo amarillo con un rayo negro","Círculo azul con una mano","Cuadrado verde con una flecha","Círculo rojo con una llama"],0],
["¿Cada cuánto deben comprobarse los interruptores diferenciales?",["Una vez al mes","Cada 10 años","Nunca","Solo tras un incendio"],0],
["Si salta un diferencial, debes:",["Desconectar el aparato causante e informar, sin forzar el rearme","Subirlo repetidamente hasta que aguante","Abrir el cuadro y puentearlo","Usar cinta aislante"],0],
["¿Por qué el contacto eléctrico es Moderado en la instalación pese a su baja probabilidad?",["Porque la consecuencia puede ser muy grave (C3)","Porque ocurre a diario","Porque no hay medidas posibles","Por el ruido"],0]]},
{t:"Uso seguro de equipos, enchufes y alargadores",ico:"🔌",min:10,src:ER+" (riesgos 150 y 151 del puesto y de «Electrodomésticos de oficina»; 151 de la instalación)",
obj:["Aplicar las normas básicas al enchufar y desenchufar.","Reconocer equipos y cables en mal estado.","Saber cuándo no usar ladrones y alargadores."],
b:[["1. Equipos seguros",UL(["Con <b>marcado CE</b> y un sistema de protección: toma de tierra, doble aislamiento o pequeñas tensiones de seguridad.","Con la protección IP adecuada al lugar donde se usan.","Antes de usarlos, revisa cable y enchufe: si hay roturas o partes en tensión al descubierto, no los uses.","Si un equipo ha sufrido un golpe fuerte o se ha mojado, no lo uses hasta que lo revise un especialista.","Las averías las repara personal especializado, nunca tú."])],
["2. Normas al conectar",T(["Haz","No hagas"],[["Desenchufa siempre cogiendo la clavija","Tirar del cable"],["Manos y pies secos","Tocar equipos con las manos mojadas o usarlos en zonas húmedas"],["Desenrolla del todo los alargadores enrollables","Abusar de alargadores"],["Comprueba la carga máxima de la base múltiple","Usar «ladrones» o sobrecargar enchufes y líneas"],["Comunica que faltan enchufes","Conectar cables sin clavija o a cable desnudo"],["Sustituye cables y enchufes dañados","Reparar con cinta aislante o hacer empalmes improvisados"],["Desconecta los equipos al final de la jornada","Dejarlos conectados sin uso"]])+NOTE("Si necesitas regletas o alargadores para varios aparatos, consulta antes con personal cualificado; nunca alargadores sin toma de tierra para equipos que la necesitan.")],
["3. Señales de alarma",`<p>Si observas <b>chispazos, cortes de suministro, olor a quemado o calentamiento</b>: no toques la instalación, desconecta el aparato e informa a la empresa. Mantén los cables lejos del agua y del calor, y no alteres carcasas ni aislantes.</p>`+CASO("El cargador caliente","El cargador del portátil está muy caliente y el cable tiene un corte en el recubrimiento.","Desenchúfalo por la clavija, no lo uses ni lo repares con cinta aislante y pide su sustitución.")]],
key:"Desenchufa por la clavija, con las manos secas; nada de ladrones, cinta aislante ni equipos dañados o mojados; desconecta al terminar y comunica cualquier chispazo o anomalía.",
q:[["La forma correcta de desenchufar un equipo es:",["Cogiendo la clavija","Tirando del cable","Con las manos mojadas","Con el pie"],0],
["Un cable con el recubrimiento cortado debe:",["Sustituirse, sin repararlo con cinta aislante","Repararse con cinta aislante","Seguir usándose con cuidado","Mojarse para enfriarlo"],0],
["Respecto a los «ladrones», la evaluación indica:",["No usarlos ni sobrecargar enchufes","Usarlos siempre","Encadenar varios","Son obligatorios"],0],
["Un equipo que se ha mojado:",["No se usa hasta que lo revise un especialista","Se seca con el secador y se usa","Se enchufa para comprobarlo","Se usa con guantes de lana"],0],
["Al final de la jornada los equipos eléctricos:",["Se desconectan","Se dejan conectados siempre","Se tapan con papel","Se mojan"],0],
["Un sistema de protección frente a contactos indirectos en equipos es:",["Toma de tierra o doble aislamiento","El color del cable","La marca comercial","El peso del equipo"],0]]}
]};
const M7={t:"Riesgos psicosociales",fmin:4,s:"Fatiga, estrés, organización del trabajo y desgaste profesional (270, 271, 273, 274), el consumo de alcohol, la violencia de clientes o usuarios (272) y cómo actuar ante una agresión o atraco (190).",L:[
{t:"Fatiga, estrés, organización y desgaste profesional",ico:"🧠",min:11,src:ER+" (riesgos 270, 271, 273 y 274 del puesto; 273 de la fuente «Factores psicosociales»)",
obj:["Reconocer los factores psicosociales evaluados en tu puesto.","Conocer las medidas organizativas previstas.","Saber cuándo y cómo comunicar una situación de sobrecarga."],
b:[["1. Los factores evaluados",T(["Riesgo","Nivel","De dónde viene"],[["270 Fatiga","Tolerable (P1 · C2)","Volumen de tareas, picos de demanda o afluencia de clientes"],["271 Estrés","Tolerable (P1 · C2)","Tareas innecesarias, sin recursos, contradictorias o sin autonomía de tiempo"],["273 Organización","Tolerable","Comunicación, participación, apoyo social y relaciones"],["274 Desgaste profesional","Tolerable (P1 · C2)","Carga cognitiva, uso continuado de PVD, falta de apoyo o de control"]])],
["2. Qué prevé la empresa",UL(["Planificar el volumen de tareas y su tiempo con antelación, y anticipar los picos de demanda con refuerzos o redistribución.","Tareas <b>claramente definidas</b> y carga repartida de forma equitativa; los cambios se comunican con antelación.","Evitar tareas innecesarias, sin recursos o con instrucciones incompatibles; dar márgenes de autonomía sobre el propio tiempo.","Planificar para evitar la urgencia continuada y la acumulación de trabajo.","Comunicación fluida y libre de rumores, participación en decisiones, apoyo de los superiores y reconocimiento.","Relaciones interpersonales adecuadas, evitando el aislamiento social o físico y resolviendo pronto los conflictos.","Pausas periódicas para la recuperación física y mental, y formación que mejore la autonomía y el control."])],
["3. Alcohol: prohibido",ALERT("Se <b>prohíbe el consumo de bebidas alcohólicas antes y durante la jornada</b>, incluida la pausa de la comida cuando forma parte del tiempo de trabajo o puede afectar a la reincorporación. Disminuye la atención, la concentración y la capacidad de respuesta.")],
["4. Cuándo se estudia más a fondo",`<p>Si se detectan de forma continuada muchas bajas voluntarias, absentismo alto, problemas disciplinarios o bajas por depresión, o hay inestabilidad, reestructuraciones o cambios de estrategia, se comunica al servicio de prevención para valorar un <b>estudio psicosocial</b> específico (arts. 4 y 16 LPRL). La evaluación recomienda además solicitar dicho estudio al servicio de prevención ajeno.</p>`+CASO("Todo es urgente","Desde hace semanas te llegan encargos de varias personas, todos «para ya» y algunos contradictorios, y te llevas trabajo a casa.","Es un factor de estrés evaluado (271/274). Habla con tu responsable para priorizar y aclarar funciones: la evaluación prevé tareas definidas, reparto equitativo, planificación y apoyo de los responsables.")]],
key:"La carga de trabajo se planifica, las tareas se definen y los cambios se comunican con antelación. Si hay sobrecarga, habla con tu responsable. Alcohol: prohibido antes y durante la jornada.",
q:[["Según la evaluación, el consumo de alcohol:",["Está prohibido antes y durante la jornada, incluida la comida si es tiempo de trabajo","Está permitido en la comida siempre","Solo se prohíbe los lunes","Se permite con moderación"],0],
["Una medida frente al estrés prevista en la evaluación es:",["Evitar tareas innecesarias o con instrucciones incompatibles","Aumentar las urgencias","Eliminar las pausas","Ocultar los cambios organizativos"],0],
["Los cambios en la organización del trabajo deben:",["Comunicarse con antelación suficiente","Aplicarse sin avisar","Comunicarse solo por rumores","No comunicarse nunca"],0],
["Ante un aumento continuado de bajas por depresión o absentismo, la evaluación prevé:",["Valorar con el servicio de prevención un estudio psicosocial","No hacer nada","Despedir a los afectados","Eliminar el teletrabajo"],0],
["Un factor que reduce el estrés según la evaluación es:",["El apoyo social y de los superiores","El aislamiento","La comunicación con rumores","La urgencia continuada"],0]]},
{t:"Atención a clientes, violencia externa y atracos",ico:"🛡️",min:10,src:ER+" (riesgos 272 y 271 del puesto; 190 de la fuente «Agresiones y situaciones de violencia»)",
obj:["Conocer las medidas frente a la violencia de clientes o usuarios.","Proteger a las trabajadoras especialmente sensibles.","Saber cómo actuar ante una agresión o atraco."],
b:[["1. Violencia de clientes o usuarios (272)",RK("272","Factores psicosociales: violencia de clientes o usuarios","Tolerable",[1,2])+UL(["Mejorar la atención al público: reducir tiempos de espera, gestionar la afluencia y contar con personal de apoyo o seguridad cuando sea necesario.","Instrucciones claras sobre tus funciones y responsabilidades en la atención al público.","Alternar la atención al público con otras tareas administrativas para no exponerte de forma continuada a situaciones de tensión.","Medios de comunicación adecuados y apoyo organizativo."])],
["2. Trabajadoras especialmente sensibles",NOTE("La evaluación recomienda <b>evitar que las trabajadoras embarazadas</b> (y, en general, las especialmente sensibles) <b>trabajen en solitario o deficientemente comunicadas</b>.")],
["3. Agresión o atraco (190)",RK("190","Agresiones de seres vivos","Tolerable",[1,2])+`<p>Lo más importante es <b>salvaguardar la integridad física</b>:</p>`+OL(["Mantén la calma; no grites, no salgas corriendo ni mientas sobre cosas fácilmente comprobables.","<b>No opongas resistencia</b> y entrega lo que exijan.","Fíjate, sin mirar fijamente, en sus rasgos físicos, voz, acento, vehículo y dirección de huida.","Recuerda los nombres o apodos que usen entre ellos.","Cuando estés a salvo, llama inmediatamente a la policía y, si hay heridos, a las ambulancias (112)."])+CASO("Cliente alterado","Un cliente empieza a levantar la voz en la oficina porque una gestión se ha retrasado y estás sola en la recepción.","Mantén la calma y no entres en confrontación; pide apoyo a un compañero o responsable. Comunícalo después: la evaluación prevé gestionar esperas, contar con apoyo y alternar la atención al público con otras tareas.")]],
key:"Ante un atraco, tu integridad es lo primero: calma, no resistirse, fijarse en detalles y avisar a la policía cuando estés a salvo. La atención al público se organiza para no exponer a nadie en solitario.",
q:[["Ante un atraco, la evaluación indica:",["No oponer resistencia y entregar lo que exijan","Enfrentarse a los asaltantes","Salir corriendo gritando","Mentir sobre lo que hay"],0],
["¿Cuándo llamar a la policía tras un atraco?",["Una vez en situación segura, inmediatamente","Delante de los atracadores","Al día siguiente","Nunca"],0],
["Para reducir la tensión en la atención al público, la evaluación propone:",["Alternarla con otras tareas administrativas","Atender sin pausa toda la jornada","Atender siempre en solitario","Eliminar las instrucciones"],0],
["La evaluación recomienda que las trabajadoras embarazadas:",["No trabajen en solitario o deficientemente comunicadas","Atiendan solas el público","Trabajen de noche","No tengan teléfono"],0],
["Durante un atraco conviene fijarse en los asaltantes:",["Sin mirarlos fijamente","Mirándolos fijamente a los ojos","Haciéndoles fotos","No fijarse en nada"],0]]}

const M8={t:"Acoso laboral, sexual y por razón de sexo",fmin:3,s:"Tolerancia cero. Qué dice la ley (LO 3/2007 y LO 10/2022), qué medidas adopta la empresa y a quién comunicar una situación de acoso, también en el ámbito digital (275).",L:[
{t:"Tolerancia cero: prevención y cómo comunicar",ico:"🚫",min:12,src:ER+" (riesgo 275 del puesto; 273 de la fuente «Factores psicosociales»)",

["2. Medidas de la empresa",UL(["Política de <b>tolerancia cero</b> integrada en las normas internas de conducta y de PRL.","Medidas negociadas con la representación de los trabajadores: <b>códigos de buenas prácticas</b>, <b>campañas informativas</b>, <b>protocolos de actuación</b> y <b>acciones formativas</b> (incluida información sobre el riesgo de violencia sexual en el puesto).","Información y sensibilización sobre qué conductas constituyen acoso, los canales y el procedimiento.","Un procedimiento interno que garantice <b>confidencialidad</b>, protección de las personas afectadas, imparcialidad en la investigación y medidas correctoras."])],

["4. Caso",CASO("Mensajes fuera de horario","Un compañero te envía de forma reiterada mensajes de contenido sexual por WhatsApp fuera del horario laboral y, en la oficina, hace comentarios sobre tu aspecto.","Es una conducta que puede constituir acoso sexual, y el ámbito digital está expresamente incluido. Guarda los mensajes y comunícalo cuanto antes a la persona designada por la empresa o, si no la conoces, al responsable de la empresa. El procedimiento garantiza confidencialidad y protección.")]],

["3. El vehículo de empresa",UL(["Revisiones periódicas e ITV al día, con la documentación reglamentaria.","Debe llevar <b>triángulos</b>, <b>chaleco reflectante</b>, rueda de repuesto (o sistema alternativo) y, recomendado, <b>extintor</b>, además de un listín de teléfonos de emergencia.","Puertas traseras con sistema que impida que el viento las abata."])+NOTE("Si tienes que detenerte en carretera: sal por la puerta contraria al tráfico con el chaleco puesto y coloca el triángulo a 50 m por detrás (y también delante si la vía es de doble sentido). Si la situación es de riesgo, sitúate en zona segura y pide ayuda.")],
["4. Transporte público y a pie",UL(["Planifica los trayectos; atención en andenes, escaleras y accesos; sujétate con el vehículo en movimiento.","No subas ni bajes de un transporte público <b>en marcha</b>.","Cruza por los pasos de cebra con el semáforo en verde, mirando a ambos lados y sin correr.","Si al bajar de un vehículo tienes que cruzar, hazlo <b>por detrás</b> de él.","Camina por la acera; si no hay, por el arcén y siempre <b>por la izquierda</b>."])]],

main.innerHTML=`<div class="view auth"><section class="hx ah"><div><img class="logo-x" src="${LOGO}" alt="PREVIJOB · Servicio de Prevención"><br><span class="eyb">Formación PRL · Art. 19 Ley 31/1995</span><h2>Personal de oficinas · Grupo Housfy: <em>entra al curso</em></h2><p class="sub">Date de alta una sola vez con tus datos y un PIN. Tu progreso, tus notas y tu resultado quedan registrados a tu nombre y podrás continuar desde cualquier dispositivo.</p></div>${RACK}</section>

${mode==="signup"?`<form class="card af" id="fs" novalidate><h3>Alta de la persona trabajadora</h3>
