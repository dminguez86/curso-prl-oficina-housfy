<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">

<style>

</style></head><body>
<header class="noprint"><img src="__LOGO__" alt="PREVIJOB"><h1>Panel de administración · Cursos PRL Previjob</h1><button id="out" hidden>🚪 Salir</button></header>
<main>
<form id="login" class="card" hidden><h2>🔐 Acceso de administración</h2><p class="mut">Introduce la contraseña de administración.</p><label>Contraseña<input id="pw" type="password" autocomplete="current-password" required></label><p class="err" id="lerr" role="alert"></p><button class="btn" type="submit">Entrar</button></form>
<section id="panel" hidden>
<div class="kpi" id="kpi"></div>
<div class="card tools noprint"><select id="cur" title="Curso"><option value="bar">Barista</option><option value="ofi">Personal de oficinas – Grupo Housfy</option><option value="taf">Técnico/a de actividades físicas y entrenamiento</option></select><input id="q" type="search" placeholder="🔎 Buscar por nombre, DNI/NIE o correo"><select id="emp"><option value="">Todas las empresas</option></select><select id="res"><option value="">APTO y NO APTO</option><option value="1">Solo APTO</option><option value="0">Solo NO APTO</option></select><button id="csv">⬇️ CSV / Excel</button><button id="rf">🔄 Actualizar</button></div>
<div class="card"><div class="tw"><table><thead><tr><th data-s="name">Nombre</th><th data-s="dni">DNI/NIE</th><th data-s="company">Empresa</th><th data-s="pct">Progreso</th><th data-s="timeSec">Tiempo conexión</th><th>Tests de lección</th><th data-s="examOk">Examen</th><th data-s="passed">Resultado</th><th data-s="passedAt">Fecha</th><th class="noprint">Acciones</th></tr></thead><tbody id="tb"></tbody></table><p class="mut" style="margin:.5rem 0 0;font-size:.85rem">El tiempo se registra desde que el alumno carga la versión actual del curso.</p></div><p class="mut" id="cnt"></p></div>
</section>
</main>
<script>
const META=__META__;
const API=location.hostname==="curso-prl-oficina-housfy.onrender.com"?"https://curso-prl-taf-api.onrender.com":"";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let CUR=sessionStorage.getItem("prl-adm-course")||"ofi";let TOK=sessionStorage.getItem("prl-adm-token")||"",W=[],sortK="company",sortD=1;
const hm=t=>(t>=60?Math.floor(t/60)+" h ":"")+(t%60?t%60+" min":"");
const fd=d=>d?d.split("-").reverse().join("/"):"—";
async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{"Content-Type":"application/json",...(TOK?{Authorization:"Bearer "+TOK}:{}),"X-Course":CUR,...(o.headers||{})}});if(r.status===401&&p!=="/api/admin/login"){logout();throw new Error("Sesión caducada")}return r}
function logout(){TOK="";sessionStorage.removeItem("prl-adm-token");$("#panel").hidden=true;$("#out").hidden=true;$("#login").hidden=false}
$("#out").onclick=logout;
$("#login").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="Comprobando… (si el servidor estaba en reposo puede tardar hasta 1 minuto)";try{const r=await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("#pw").value})}),j=await r.json();if(!r.ok){$("#lerr").textContent=j.error||"Error";return}TOK=j.token;sessionStorage.setItem("prl-adm-token",TOK);$("#pw").value="";$("#lerr").textContent="";show()}catch(x){$("#lerr").textContent="No se pudo conectar con el servidor."}};
async function loadCourses(){try{const r=await api("/api/admin/courses"),j=await r.json();if(j.courses)$("#cur").innerHTML=j.courses.map(c=>`<option value="${esc(c.id)}" ${c.id===CUR?"selected":""}>${esc(c.name)} (${c.workers??0})</option>`).join("")}catch(e){}$("#cur").value=CUR}
async function show(){await loadCourses();$("#login").hidden=true;$("#panel").hidden=false;$("#out").hidden=false;await load()}
async function load(){$("#cnt").textContent="Cargando…";const r=await api("/api/admin/workers"),j=await r.json();W=j.workers;const es=[...new Set(W.map(w=>w.company))].sort((a,b)=>a.localeCompare(b,"es")),cur=$("#emp").value;$("#emp").innerHTML=`<option value="">Todas las empresas (${es.length})</option>`+es.map(e=>`<option ${e===cur?"selected":""}>${esc(e)}</option>`).join("");render()}
function filtered(){const q=$("#q").value.trim().toLowerCase(),e=$("#emp").value,rs=$("#res").value;return W.filter(w=>(!e||w.company===e)&&(rs===""||String(+w.passed)===rs)&&(!q||(w.name+" "+w.dni+" "+w.email+" "+w.company).toLowerCase().includes(q))).sort((a,b)=>{const x=a[sortK]??"",y=b[sortK]??"";return (typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"es"))*sortD})}
function render(){const L=filtered(),ap=L.filter(w=>w.passed).length,avg=L.length?Math.round(L.reduce((a,w)=>a+w.pct,0)/L.length):0;
$("#kpi").innerHTML=`<div><b>${L.length}</b><span>personas (filtro actual)</span></div><div><b>${ap}</b><span>APTO</span></div><div><b>${L.length-ap}</b><span>NO APTO / pendientes</span></div><div><b>${avg}%</b><span>progreso medio</span></div>`;
$("#tb").innerHTML=L.map(w=>`<tr><td><b>${esc(w.name)}</b><br><small class="mut">${esc(w.email)}</small></td><td>${esc(w.dni)}</td><td>${esc(w.company)}</td><td><span class="bar"><i style="width:${w.pct}%"></i></span>${w.pct}%</td><td>${w.timeSec===0||!w.timeSec?"Sin datos":w.timeSec<60?"&lt; 1 min":Math.floor(w.timeSec/3600)+" h "+Math.floor(w.timeSec%3600/60)+" min"}</td><td><small>${w.modules.map((m,i)=>(CUR==="ofi"||CUR==="hbd"||CUR==="bar"?`L${i}: `:`M${i+1}: `)+(m.final??"–")).join(" · ")}</small></td><td>${w.examOk!=null?w.examOk+"/"+w.examN:"—"}</td><td>${w.passed?'<span class="ok">APTO</span>':'<span class="no">NO APTO</span>'}</td><td>${fd(w.passedAt)}</td><td class="noprint">${CUR==="ofi"?`<button data-r="${esc(w.dni)}">📊 Informe del curso</button> `:""}${w.firma?`<button data-f="${esc(w.dni)}" data-k="info" title="Firmado el ${new Date(w.firma.at).toLocaleDateString('es-ES')}">📄 Entrega información</button> <button data-f="${esc(w.dni)}" data-k="med" title="${w.firma.medical?'Autoriza':'No autoriza'} la revisión médica">🩺 Revisión médica (${w.firma.medical?'Sí':'No'})</button> `:(CUR==="ofi"?'<button disabled title="Se activa cuando el trabajador firme antes del examen final">📄 Entrega información</button> <button disabled title="Se activa cuando el trabajador firme antes del examen final">🩺 Revisión médica</button> <small class="mut">(sin firmar)</small> ':'')}<button class="del" data-d="${esc(w.dni)}">🗑️ Eliminar</button></td></tr>`).join("")||`<tr><td colspan="10" class="mut">Sin resultados.</td></tr>`;
$("#cnt").textContent=`${L.length} de ${W.length} personas dadas de alta.`;
$("#tb").querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{const w=W.find(x=>x.dni===b.dataset.d);if(!confirm(`¿Eliminar definitivamente a ${w.name} (${w.dni}) y todo su progreso?`))return;const r=await api("/api/admin/workers/"+encodeURIComponent(w.dni),{method:"DELETE"});if(r.ok)load();else alert("No se pudo eliminar.")})
$("#tb").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>docPdf(b.dataset.f,b.dataset.k,b));$("#tb").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>informe(b.dataset.r,b))}
// Informe del alumno (formato GMM/Previjob) en PDF
let H2P=null;const loadH2p=()=>H2P?Promise.resolve(H2P):new Promise((ok,ko)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";s.onload=()=>ok(H2P=window.html2pdf);s.onerror=ko;document.head.append(s)});
async function informe(dni,btn){const t0=btn.textContent;btn.disabled=true;btn.textContent="⏳ Generando…";try{
const r=await api("/api/admin/workers/"+encodeURIComponent(dni)),j=await r.json();if(!r.ok)throw new Error(j.error||"No encontrado");const w=j.worker,h2p=await loadH2p();
const s=w.scores||{},tk=w.timeByKey||{},at=w.attempts||{},log=w.connectionLog||[],nc=w.connections??log.length,ts=w.timeSec||0;
const mad=(d,o)=>new Date(d).toLocaleString("es-ES",Object.assign({timeZone:"Europe/Madrid"},o)),fdt=d=>d?mad(d,{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"}).replace(",",""):"—";
const hms=t=>{t=Math.floor(t||0);return`${Math.floor(t/3600)}:${String(Math.floor(t/60)%60).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`},last=fdt(w.updated||w.lastLogin);
const pc=(sc,q)=>sc==null?"—":Math.round(sc/q*100)+"%",prog=[],tests=[];
META.titles.forEach((T,m)=>{(META.lt?META.lt[m]:Array(META.lessons[m]).fill("")).forEach((lt,i)=>{const sc=s[`${m}-${i}`],nm=`${m}.${i+1} ${lt}`;prog.push([nm,sc!=null?"Completado":"Pendiente",`${m}-${i}`]);tests.push([`Test lección ${m}.${i+1}`,nm,pc(sc,META.lessonQ[m][i]),`${m}-${i}`])});
const f=s[`${m}-final`],nm=`Test final lección ${m}`;prog.push([nm,f!=null?"Completado":"Pendiente",`${m}-final`]);tests.push([nm,`Lección ${m}. ${T}`,pc(f,META.finalN[m]),`${m}-final`])});
const ex=w.examOk!=null?Math.round(w.examOk/w.examN*100)+"%":"—";prog.push(["Examen final del curso",w.passed?"Completado":"Pendiente","exam"]);tests.push(["Examen final","Examen final del curso",ex,"exam"]);
const hasT=Object.keys(tk).length>0,hasA=Object.keys(at).length>0,tl=Object.values(tk).reduce((a,b)=>a+b,0);
const kv=rows=>rows.map(r=>`<tr>${r.map((c,i)=>`<td class=${i%2?"v":"k"}>${esc(c)}</td>`).join("")}</tr>`).join("");
const stamp=mad(new Date(),{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).replace(/(\d+)\/(\d+)\/(\d+),?/,"$3-$2-$1"),name=String(w.name||"").toUpperCase(),H=(META.tot/60).toFixed(2)+" Horas",CN="PRL para Personal de oficinas – Grupo Housfy (art. 19 LPRL)",CC="PRL-OFI-HOUSFY";
const el=document.createElement("div");el.className="gmm";el.innerHTML=`<style>.gmm{font-family:Arial,Helvetica,sans-serif;font-size:8.5pt;color:#222;width:186mm;background:#fff}.gmm .top{display:flex;align-items:center;gap:16px;margin-bottom:10px}.gmm .top img{height:42px}.gmm .top h1{font-size:13pt;font-weight:normal;margin:0}
.gmm h2{background:#0066a1;color:#fff;font-size:10pt;margin:14px 0 0;padding:5px 7px}.gmm table{width:100%;border-collapse:collapse}.gmm td,.gmm th{border:1px solid #d5d9dd;padding:3px 6px;text-align:left;vertical-align:top;white-space:normal;position:static;cursor:default;font-size:8.5pt}
.gmm th{background:#0066a1;color:#fff;font-weight:bold}.gmm td.k{font-weight:bold;background:#f5f7f9}.gmm .c{text-align:center}.gmm .note{font-size:7.5pt;color:#555;margin:4px 0 0}</style>
<div class=top><img src="${document.querySelector("header img").src}"><h1>Informe alumno: ${esc(name)} (${stamp})</h1></div>
<h2>Datos del curso</h2><table>${kv([["Acción Formativa:",CN,"Cod. Acción Formativa:",CC],["Grupo:",CC+" · "+(w.company||"—"),"Cod grupo:",CC],["Modalidad:","ONLINE","",""],["Horas Totales curso:",H,"Horas a cursar:",H+" (100 % del contenido)"],["Fecha inicio curso:","N/D (curso abierto)","Fecha fin curso:","N/D (curso abierto)"],["Profesores:","Previjob · Servicio de Prevención","Nº de alumnos:",String(W.length)]])}</table>
<h2>Alumno: ${esc(name)}</h2><table>${kv([["Nombre",w.name,"Nº de conexiones",String(nc),"Post en foros","N/D"],["DNI",w.dni,"Tiempo invertido en lecciones",hms(ts),"Chat","N/D"],["E-mail",w.email||"—","Tiempo mínimo (Lecciones)","N/D","Documentos compartidos","N/D"],["Empresa",w.company||"—","Superación de contenidos",`${w.pct??0} / 100 (${w.pct??0} %)`,"Mensajes(enviados/recibidos)","N/D"],["Primera conexión",fdt(w.created),"Estado",w.passed?"Apto":"No apto","Descarga del certificado","No"],["Última conexión",last,"Fecha de finalización",w.passedAt?w.passedAt.split("-").reverse().join("/"):"—","",""]])}</table>
<p class=note>Primera conexión = fecha de alta en la plataforma. N/D = dato no registrado por esta plataforma.</p>
<h2>Progreso de lecciones</h2><table><tr><th>Lecciones</th><th>Tiempo en la lección</th><th>Cumplimiento tiempo mínimo</th><th>Última conexión</th></tr>${prog.map(([a,b,k])=>`<tr><td>${esc(a)}</td><td class=c>${tk[k]?hms(tk[k]):hasT?"0:00:00":"N/D"}</td><td>${b}</td><td>${b==="Completado"?last:"—"}</td></tr>`).join("")}</table>
<p class=note>Tiempo activo (pestaña visible y sesión iniciada) en cada lección/test. «Última conexión» es la última actividad registrada del alumno en el curso.</p>
<h2>Realización de test</h2><table><tr><th>Ejercicios</th><th>Lecciones</th><th>Puntuación</th><th>Intentos</th></tr>${tests.map(([a,b,c,k])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td><td class=c>${c}</td><td class=c>${at[k]?at[k]:(c==="—"?"0":"N/D")}</td></tr>`).join("")}</table>
<p class=note>Puntuación: mejor nota obtenida. Criterio de superación: 70 % de aciertos. Intentos: veces que se ha completado el test.</p>
<h2>Desglose de tiempo por secciones/herramientas</h2><table><tr><th>Herramienta</th><th>Tiempo</th><th>Herramienta</th><th>Tiempo</th></tr><tr><td>Tiempo en lecciones y tests</td><td>${hasT?hms(tl):"0:00:00"}</td><td>Otras herramientas (foros, chat, notas…)</td><td>N/D</td></tr><tr><td class=k>Tiempo total en el curso</td><td><b>${hms(ts)}</b></td><td></td><td></td></tr></table>
<h2>Conexiones a las herramientas del curso</h2>${log.length?`<table><tr><th>Herramienta</th><th>Fecha</th><th>IP</th></tr>${log.map(c=>`<tr><td>${esc(c.tool||"Acceso")}</td><td>${fdt(c.at)}</td><td>${esc(c.ip||"N/D")}</td></tr>`).join("")}</table>`:""}
<p class=note style="font-size:8.5pt">${log.length?"Registro de accesos al curso (alta, login y reanudación de sesión) con la IP de origen.":"Sin conexiones registradas."}</p>`;
await h2p().set({margin:[12,12,14,12],filename:"informe-"+String(w.name||w.dni).replace(/[^\w\u00C0-\u017F]+/g,"-")+".pdf",image:{type:"jpeg",quality:.95},html2canvas:{scale:2,useCORS:true,backgroundColor:"#fff"},jsPDF:{unit:"mm",format:"a4"},pagebreak:{mode:["css","legacy"],avoid:["tr","h2",".top"]}}).from(el).save()
}catch(e){alert("No se pudo generar el informe: "+e.message)}btn.disabled=false;btn.textContent=t0}
// Documentos firmados en PDF (jsPDF)
let JSPDF=null;const loadJs=()=>JSPDF?Promise.resolve(JSPDF):new Promise((ok,ko)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";s.onload=()=>ok(JSPDF=window.jspdf.jsPDF);s.onerror=ko;document.head.append(s)});
const toPng=src=>new Promise((ok,ko)=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=i.naturalWidth;c.height=i.naturalHeight;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0);ok({d:c.toDataURL("image/png"),w:i.naturalWidth,h:i.naturalHeight})};i.onerror=ko;i.src=src});
async function docPdf(dni,kind,btn){const t0=btn.textContent;btn.disabled=true;btn.textContent="⏳ Generando…";try{
const r=await api("/api/admin/workers/"+encodeURIComponent(dni)+"/firma"),f=await r.json();if(!r.ok)throw new Error(f.error||"No se pudo obtener la firma");
const J=await loadJs(),logo=await toPng(document.querySelector("header img").src),sg=await toPng(f.signature);
const doc=new J({unit:"mm",format:"a4"}),W=210,M=22,TW=W-2*M,dt=new Date(f.signedAt),fecha=dt.toLocaleDateString("es-ES",{timeZone:"Europe/Madrid",day:"2-digit",month:"2-digit",year:"numeric"}),hora=dt.toLocaleTimeString("es-ES",{timeZone:"Europe/Madrid",hour:"2-digit",minute:"2-digit"});
doc.addImage(logo.d,"PNG",M,12,40,40*logo.h/logo.w);let y=40;
const par=(txt,o={})=>{doc.setFont("helvetica",o.b?"bold":"normal");doc.setFontSize(o.s||10.5);const L=doc.splitTextToSize(txt,o.w||TW);doc.text(L,o.x||M,y,{align:"justify",maxWidth:o.w||TW,lineHeightFactor:1.45});y+=L.length*(o.s||10.5)*0.3528*1.45+(o.after??4)};
const title=t=>{doc.setFont("helvetica","bold");doc.setFontSize(15);doc.setTextColor(6,71,107);doc.text(t,W/2,y,{align:"center"});doc.setTextColor(0);y+=6};
const sigBlock=(x,yy,label,bh=30)=>{doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.text(label,x,yy);doc.setFont("helvetica","normal");const nl=doc.splitTextToSize(f.name,72);doc.text(nl,x,yy+6);yy+=6+(nl.length-1)*5;doc.text("Firma:",x,yy+7);let sh=Math.min(bh,62*sg.h/sg.w),sw=sh*sg.w/sg.h;doc.addImage(sg.d,"PNG",x,yy+9,sw,sh);doc.setDrawColor(150);doc.rect(x,yy+9,sw,sh);const yb=yy+9+sh+7;doc.text("DNI/NIE: "+f.dni,x,yb);doc.text("Fecha: "+fecha,x,yb+6);return yb+6};
const empBlock=(x,yy,bh=30)=>{doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.text("Empresa:",x,yy);doc.setFont("helvetica","normal");const cl=doc.splitTextToSize(f.company,72);doc.text(cl,x,yy+6);yy+=6+(cl.length-1)*5;doc.text("Firma y sello:",x,yy+7);doc.setDrawColor(150);doc.rect(x,yy+9,62,bh);doc.text("DNI:",x,yy+bh+16);doc.text("Fecha:",x,yy+bh+22);return yy+bh+22};
const foot=()=>{doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(90);doc.text(doc.splitTextToSize(`Firmado electrónicamente por la persona trabajadora en el curso online «${f.courseName}» (${f.courseCode}) el ${fecha} a las ${hora} (hora de Madrid)${f.ip?", desde la IP "+f.ip:""}.`,TW),M,276);doc.text("Documento cedido por PREVIJOB SL",W-M,287,{align:"right"});doc.setTextColor(0)};
